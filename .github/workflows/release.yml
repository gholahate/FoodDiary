# Выпуск: запускается, когда на сайте GitHub публикуется Release с тегом
# вида v0.6.0. Собирает подписанный APK и прикладывает к релизу:
#   FoodDiary-0.6.0.apk          — само приложение;
#   FoodDiary-0.6.0.apk.sha256   — контрольная сумма;
#   version.json                 — что читает приложение при проверке обновлений.
name: Выпуск

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Проверить версию
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME=$(grep '^appVersionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          CODE=$(grep '^appVersionCode=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$TAG" != "v$NAME" ]; then
            echo "::error::Тег релиза $TAG не совпадает с версией в gradle.properties (appVersionName=$NAME). Нужен тег v$NAME."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Проверить секреты
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Сборка release
        env:
          FOODDIARY_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FOODDIARY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FOODDIARY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FOODDIARY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Подготовить файлы
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          NOTES: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          SRC=androidApp/build/outputs/apk/release/androidApp-release.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::Подписанный APK не найден (возможно, собрался неподписанный). Проверьте секреты."
            ls -la androidApp/build/outputs/apk/release/ || true
            exit 1
          fi
          APK="FoodDiary-$VERSION_NAME.apk"
          cp "$SRC" "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SHA  $APK" > "$APK.sha256"
          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apkUrl "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/$APK" \
            --arg sha256 "$SHA" \
            --arg notes "$NOTES" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionName: $versionName, versionCode: $versionCode, apkUrl: $apkUrl, sha256: $sha256, notes: $notes, publishedAt: $publishedAt}' \
            > version.json
          cat version.json

      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "FoodDiary-$VERSION_NAME.apk" \
            "FoodDiary-$VERSION_NAME.apk.sha256" \
            version.json \
            --clobber
