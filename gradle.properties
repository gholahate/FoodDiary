org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# ---- App version (the ONLY place to change it; see RELEASING.md) ----
# appVersionCode must grow with every release: 0.6.0 -> 600, 0.6.1 -> 601, 1.0.0 -> 10000.
appVersionName=0.6.0
appVersionCode=600

# Debug builds from Android Studio are installed as a separate app
# (com.fooddiary.android.debug, "Дневник (debug)") with their own data.
# Leave EMPTY only for the one-time move described in RELEASING.md, step 4.
debugAppIdSuffix=.debug
